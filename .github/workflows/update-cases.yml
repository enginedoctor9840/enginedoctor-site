name: 블로그 사례 자동 반영
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_cases.py
      - name: 변경 사항 저장
        run: |
          if [ -n "$(git status --porcelain latest.json)" ]; then
            git config user.name "enginedoctor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add latest.json
            git commit -m "블로그 최신 사례 반영"
            git push
          fi
